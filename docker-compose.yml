version: '3.8'

services:
  valkey:
    image: valkey/valkey:unstable
    container_name: valkey-search-demo
    # No published port: the app reaches Valkey over the compose network. Valkey runs
    # without a password, so it must not be reachable from other machines.
    volumes:
      # Mount the 1.3 libsearch.so built from the valkey-search repo
      - ./libsearch.so:/usr/lib/valkey/modules/libsearch.so:ro
    command: >
      valkey-server
      --loadmodule /usr/lib/valkey/modules/libsearch.so
      --save ""
      --appendonly no
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: valkey-search-demo-app
    ports:
      # Localhost only: the app has no authentication.
      - "127.0.0.1:8501:8501"
    environment:
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
    depends_on:
      valkey:
        condition: service_healthy
